name: kokoro_tts_flutter
description: A Flutter implementation of Kokoro-TTS using ONNX Runtime for high-quality multi-language text-to-speech synthesis.
version: 0.2.1-exp
homepage: https://github.com/yansigit/Kokoro-TTS-Flutter
repository: https://github.com/yansigit/Kokoro-TTS-Flutter
issue_tracker: https://github.com/yansigit/Kokoro-TTS-Flutter/issues
documentation: https://github.com/yansigit/Kokoro-TTS-Flutter#readme

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0
  path: ^1.8.3
  path_provider: ^2.1.1
  malsami: ^0.0.3
  flutter_onnxruntime: ^1.4.3  # For ONNX model inference
  just_audio: ^0.10.3     # For audio playback
  http: ^1.1.0            # For downloading model files
  collection: ^1.18.0
  async: ^2.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  integration_test:
    sdk: flutter

flutter:
  assets:
    - assets/
